<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>内容管理 · Sit</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Sveltia CMS 本地部署版。
      原版从 unpkg 加载，且其图标字体依赖 cdn.jsdelivr.net，
      在部分网络环境下字体加载失败会导致图标显示成文字（menu/article/photo…）。
      此处改为本地 vendor 文件，脚本与三个字体全部同源，无外部 CDN 依赖。
      升级方式：替换 ../../vendor/sveltia-cms.js 与 fonts/ 下的文件即可。
    -->
    <link
      rel="preload"
      href="/admin/vendor/fonts/material-symbols-outlined.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <script src="/admin/vendor/sveltia-cms.js" type="module"></script>
  </body>
</html>
