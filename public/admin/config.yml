backend:
  name: github
  repo: sitxiaochen/sitxiaochen.github.io
  branch: main

# ---------------------------------------------------------------
# 认证方式说明
#
# Sveltia CMS 的 GitHub PKCE 认证依赖 GitHub 侧支持，
# 该能力 GitHub 原计划 2025 Q4 上线但目前搁置，
# 因此使用「个人访问令牌（PAT）」登录：无需 OAuth App、无需代理服务器。
#
# 登录步骤：
#   1. 打开 https://sitxiaochen.github.io/admin/
#   2. 点 "Sign In with Token"
#   3. 按提示在 GitHub 生成 token 并粘贴
#
# Token 权限要求（fine-grained token）：
#   - Contents        : Read and write   （提交文章、上传图片）
#   - Pull requests   : Read and write   （Editorial 工作流开 PR）
#   - Metadata        : Read-only（自动附带）
# 或使用 classic token，勾选 repo 作用域即可。
#
# 不要提交任何 token 到本仓库；token 只保存在浏览器 localStorage。
# ---------------------------------------------------------------

# 本地开发：npm run dev 后访问 /admin/ 可直接改写本地文件
local_backend: false

# 编辑工作流：保存先落到 PR，合并后才上线
publish_mode: editorial_workflow

media_folder: public/images/uploads
public_folder: /images/uploads

site_url: https://sitxiaochen.github.io
display_url: https://sitxiaochen.github.io
logo_url: https://sitxiaochen.github.io/favicon.svg
locale: zh_Hans

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{title}} — {{category}}'
    sortable_fields: [publishedAt, title, category]
    fields:
      - { name: title, label: 标题, widget: string, hint: '不超过 120 字' }
      - {
          name: description,
          label: 摘要,
          widget: text,
          hint: '用于列表与 SEO，不超过 300 字',
          pattern: ['^.{1,300}$', '摘要不能超过 300 字'],
        }
      - { name: publishedAt, label: 发布日期, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { name: updatedAt, label: 更新日期, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - {
          name: category,
          label: 分类,
          widget: select,
          options: [AI, DevOps, Linux, 云原生, 前端开发, 大语言模型, 开发工具, 卸载软件工具, 镜像引导工具, 杂谈],
          default: 杂谈,
        }
      - { name: tags, label: 标签, widget: list, required: false, default: [], field: { name: tag, label: 标签, widget: string } }
      - { name: draft, label: 草稿, widget: boolean, default: false }
      - { name: lang, label: 语言, widget: hidden, default: zh-CN }
      - { name: cover, label: 封面图, widget: image, required: false }
      - { name: body, label: 正文, widget: markdown }
